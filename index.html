<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpenFishTools Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  
  <!-- Separated CSS: Theme (Colors & Variables, Cal Sans Font), Layout, and Modular Modal -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/context-menu.css">
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

  <!-- Main Mobile / Studio App Shell Container -->
  <main class="app-viewport">

    <!-- Top Half / Brand Area: Brand Title & Navigation -->
    <header class="studio-header">
      <div class="brand-wrapper">
        <h1 class="brand-title">OpenFishTools</h1>
        <div class="brand-subtitle-row">
          <span class="brand-subtitle">Studio</span>
          <span class="badge-pre-alpha" id="studio-version-badge">0.1.0 PA</span>
        </div>
      </div>
    </header>

    <!-- Minimalist Static Editing Doodles (Timeline, Graph, Keyframes, Film, Play/Next/Prev) -->
    <div class="studio-doodles-container" aria-hidden="true">
      <img src="assets/doodles.svg" class="studio-doodles-svg" alt="" draggable="false" />
    </div>

    <!-- Technical Coordinate Grid Overlay with Blueprint "Building" App Icon -->
    <aside class="tech-grid-container" aria-hidden="true">
      <img src="assets/grid.svg" class="tech-grid-svg" alt="" draggable="false" />
      
      <!-- Icon Frame with Object Corner Handles -->
      <div class="icon-build-frame">
        <!-- Enlarged App Icon (Clean & Unobstructed) -->
        <img src="assets/icon.svg" class="grid-center-icon" alt="OpenFishTools Logo" draggable="false" />

        <!-- Snug Vector Handles Asset -->
        <img src="assets/handles.svg" class="object-handles-svg" alt="" draggable="false" />
      </div>
    </aside>

    <!-- Dashboard Container (Bottom Half on Mobile, Responsive on Tablet/Fold/Web) -->
    <section class="dashboard-container">

      <!-- Action Buttons Row (Interactive Hover & Press animations) -->
      <div class="action-buttons-row">
        <!-- New Project Button with background watermark icon & modular modal trigger -->
        <button type="button" class="action-btn btn-new-project" aria-label="Create New Project" onclick="Modal.open('modal-new-project')">
          <div class="btn-bg-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8L10 4H4zm8 5c.55 0 1 .45 1 1v2h2c.55 0 1 .45 1 1s-.45 1-1 1h-2v2c0 .55-.45 1-1 1s-1-.45-1-1v-2H9c-.55 0-1-.45-1-1s.45-1 1-1h2v-2c0-.55.45-1 1-1z"/>
            </svg>
          </div>
          <span class="action-btn-title">New Project</span>
        </button>

        <!-- Import Project Button with background watermark icon -->
        <button type="button" class="action-btn btn-import-project" aria-label="Import Existing Project" onclick="Modal.open('modal-import-project')">
          <div class="btn-bg-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8L10 4H4zm8 3c.55 0 1 .45 1 1v4.59l1.3-1.29c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41l-3 3a.996.996 0 0 1-1.41 0l-3-3a.996.996 0 1 1 1.41-1.41l1.29 1.29V8c0-.55.45-1 1-1z"/>
            </svg>
          </div>
          <span class="action-btn-title">Import Project</span>
        </button>
      </div>

      <!-- "Your Project" Container populated dynamically from Database/projects.json -->
      <section class="projects-panel" aria-labelledby="your-projects-heading">
        <header class="projects-panel-header">
          <h2 class="projects-title" id="your-projects-heading">Your Project</h2>
          <span class="project-count-badge" id="project-count-badge">5</span>
        </header>

        <!-- Project items (synced dynamically with FishDatabase via js/main.js) -->
        <div class="projects-list" id="projects-container"></div>
      </section>

    </section>

  </main>

  <!-- ==========================================================================
       MODULAR POP-UP: NEW PROJECT MODAL
       - Auto slide from top on mobile, center scale on tablet/desktop
       - Closeable by clicking empty backdrop or native back button
       ========================================================================== -->
  <div class="modal-backdrop" id="modal-new-project" role="dialog" aria-modal="true" aria-label="New Project Dialog">
    <div class="modal-card" onclick="event.stopPropagation()">
      <!-- Editable Project Title Header -->
      <header class="modal-header">
        <input type="text" id="project-input-name" class="modal-title-input" value="New Project" placeholder="Enter Project Name..." autocomplete="off" spellcheck="false" aria-label="Project Name">
      </header>

      <div class="modal-body">
        <!-- 1. Aspect Ratio (Visual Frames) -->
        <div class="modal-form-group">
          <label class="modal-label">ASPECT RATIO</label>
          <div class="modal-aspect-grid" id="options-aspect-ratio">
            <button type="button" class="aspect-ratio-frame is-selected" data-val="16:9" title="16:9 Landscape">
              <div class="aspect-frame-box ratio-16-9">
                <span class="aspect-ratio-text">16:9</span>
              </div>
            </button>
            <button type="button" class="aspect-ratio-frame" data-val="9:16" title="9:16 Portrait">
              <div class="aspect-frame-box ratio-9-16">
                <span class="aspect-ratio-text">9:16</span>
              </div>
            </button>
            <button type="button" class="aspect-ratio-frame" data-val="1:1" title="1:1 Square">
              <div class="aspect-frame-box ratio-1-1">
                <span class="aspect-ratio-text">1:1</span>
              </div>
            </button>
            <button type="button" class="aspect-ratio-frame" data-val="4:3" title="4:3 Standard">
              <div class="aspect-frame-box ratio-4-3">
                <span class="aspect-ratio-text">4:3</span>
              </div>
            </button>
            <button type="button" class="aspect-ratio-frame" data-val="21:9" title="21:9 Ultrawide">
              <div class="aspect-frame-box ratio-21-9">
                <span class="aspect-ratio-text">21:9</span>
              </div>
            </button>
          </div>
        </div>

        <!-- 2. Resolution Dropdown Row -->
        <div class="modal-form-row">
          <label class="modal-label">Resolution</label>
          <div class="custom-dropdown" id="dropdown-resolution" data-value="1080p">
            <button type="button" class="custom-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Select Resolution">
              <span class="custom-dropdown-label">1080p</span>
              <svg class="custom-dropdown-arrow" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 10l5 5 5-5z"/>
              </svg>
            </button>
            <div class="custom-dropdown-menu" role="listbox">
              <div class="custom-dropdown-item" role="option" data-val="4K">4K</div>
              <div class="custom-dropdown-item" role="option" data-val="2K">2K</div>
              <div class="custom-dropdown-item is-selected" role="option" data-val="1080p">1080p</div>
              <div class="custom-dropdown-item" role="option" data-val="720p">720p</div>
              <div class="custom-dropdown-item" role="option" data-val="480p">480p</div>
            </div>
          </div>
        </div>

        <!-- 3. FPS Dropdown Row -->
        <div class="modal-form-row">
          <label class="modal-label">FPS</label>
          <div class="custom-dropdown" id="dropdown-fps" data-value="60">
            <button type="button" class="custom-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Select Frame Rate">
              <span class="custom-dropdown-label">60 FPS</span>
              <svg class="custom-dropdown-arrow" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 10l5 5 5-5z"/>
              </svg>
            </button>
            <div class="custom-dropdown-menu" role="listbox">
              <div class="custom-dropdown-item" role="option" data-val="120">120 FPS</div>
              <div class="custom-dropdown-item is-selected" role="option" data-val="60">60 FPS</div>
              <div class="custom-dropdown-item" role="option" data-val="50">50 FPS</div>
              <div class="custom-dropdown-item" role="option" data-val="45">45 FPS</div>
              <div class="custom-dropdown-item" role="option" data-val="30">30 FPS</div>
              <div class="custom-dropdown-item" role="option" data-val="25">25 FPS</div>
              <div class="custom-dropdown-item" role="option" data-val="16">16 FPS</div>
            </div>
          </div>
        </div>

        <!-- 4. Background Color -->
        <div class="modal-form-group">
          <label class="modal-label">BACKGROUND COLOR</label>
          <div class="modal-color-swatches" id="options-bgcolor">
            <button type="button" class="modal-color-swatch swatch-transparent is-selected" data-val="transparent" title="Transparan"></button>
            <button type="button" class="modal-color-swatch" style="background-color: #0d1109;" data-val="#0d1109" title="Matcha Canvas"></button>
            <button type="button" class="modal-color-swatch" style="background-color: #98ce7b;" data-val="#98ce7b" title="Matcha Green"></button>
            <button type="button" class="modal-color-swatch" style="background-color: #000000;" data-val="#000000" title="Hitam"></button>
            <button type="button" class="modal-color-swatch" style="background-color: #00ff00;" data-val="#00ff00" title="Hijau"></button>
            <button type="button" class="modal-color-swatch" style="background-color: #0047bb;" data-val="#0047bb" title="Biru"></button>
          </div>
        </div>
      </div>

      <!-- 5. Create Button -->
      <footer class="modal-footer">
        <button type="button" class="modal-btn-create" onclick="createNewProjectAction()">
          <span>Create Project</span>
        </button>
      </footer>
    </div>
  </div>

  <!-- ==========================================================================
       MODULAR POP-UP: IMPORT PROJECT MODAL
       - Modular Drag & Drop container for project file ingestion
       - Slide from top on mobile, center scale on desktop
       - Closeable by clicking backdrop or native back button
       ========================================================================== -->
  <div class="modal-backdrop" id="modal-import-project" role="dialog" aria-modal="true" aria-label="Import Project Dialog">
    <div class="modal-card" onclick="event.stopPropagation()">
      <header class="modal-header">
        <h3 class="modal-title">Import Project</h3>
      </header>

      <div class="modal-body">
        <div class="modal-dropzone" id="import-dropzone" tabindex="0" role="button" aria-label="Drop .ofts file here or click to browse">
          <input type="file" id="import-file-input" class="modal-dropzone-input" accept=".ofts" aria-hidden="true" style="display: none;">
          <div class="dropzone-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
              <path d="M4 4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8L10 4H4zm8 3c.55 0 1 .45 1 1v4.59l1.3-1.29c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41l-3 3a.996.996 0 0 1-1.41 0l-3-3a.996.996 0 1 1 1.41-1.41l1.29 1.29V8c0-.55.45-1 1-1z"/>
            </svg>
          </div>
          <span class="dropzone-title">Drag &amp; Drop .ofts file here</span>
          <span class="dropzone-subtitle">Select project file (.ofts)</span>
          <div class="dropzone-formats">
            <span class="dropzone-badge">.OFTS</span>
          </div>
          <span class="dropzone-file-status" id="import-file-status"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       MODULAR POP-UP: RENAME PROJECT MODAL
       ========================================================================== -->
  <div class="modal-backdrop" id="modal-rename-project" role="dialog" aria-modal="true" aria-label="Rename Project Dialog">
    <div class="modal-card" onclick="event.stopPropagation()">
      <header class="modal-header">
        <h3 class="modal-title">Rename Project</h3>
      </header>

      <div class="modal-body">
        <div class="modal-form-group">
          <label class="modal-label" for="rename-input-name">PROJECT NAME</label>
          <input type="text" id="rename-input-name" class="modal-input-text" placeholder="Enter new project name" autocomplete="off" spellcheck="false">
          <input type="hidden" id="rename-project-id">
        </div>
      </div>

      <footer class="modal-footer">
        <button type="button" class="modal-btn-create" onclick="saveRenameProjectAction()">
          <span>Rename Project</span>
        </button>
      </footer>
    </div>
  </div>

  <script src="js/jszip.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/context-menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
