<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OpenFishTools Studio - Desktop Workstation</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1015">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenFishTools">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <script>
    try {
      if (localStorage.getItem('oft_desktop_mobile_dismissed') === 'mobile') {
        window.location.replace('editor.html' + (window.location.search || ''));
      }
    } catch (_) {}
  </script>
  
  <!-- CSS: Theme (Colors & Variables, Cal Sans Font), Editor Layout, and Modular Modal / Popover / Drawer / Switch -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/popover.css">
  <link rel="stylesheet" href="css/drawer.css">
  <link rel="stylesheet" href="css/switch.css">
  <link rel="stylesheet" href="css/segmented-button.css">
  <link rel="stylesheet" href="css/wireframe.css">
  <link rel="stylesheet" href="css/transform-controller.css">
  <link rel="stylesheet" href="css/effects-rack.css">
  <link rel="stylesheet" href="css/scene-editor.css">
  <link rel="stylesheet" href="css/color-picker.css">
  <link rel="stylesheet" href="css/template-editor.css">
  <link rel="stylesheet" href="css/safari.css">
  <link rel="stylesheet" href="css/desktop.css?v=0.5.74">
  <script src="js/sync-height.js"></script>
  <script>
    window.DEBUG = true;
    try {
      var _urlParams = new URLSearchParams(window.location.search);
      var _urlName = _urlParams.get('name');
      var _urlId = _urlParams.get('id');
      if (_urlName) {
        document.title = _urlName + ' - OpenFishTools Studio';
      } else if (_urlId) {
        var _cached = localStorage.getItem('oft_active_project_backup_' + _urlId);
        if (_cached) {
          var _parsed = JSON.parse(_cached);
          if (_parsed && _parsed.name) document.title = _parsed.name + ' - OpenFishTools Studio';
        }
      }
    } catch (_) {}
    window._dismissLoadingOverlay = function() {
      var ov = document.getElementById('editor-loading-overlay');
      if (ov && !ov.classList.contains('is-hidden')) {
        ov.classList.add('is-hidden');
        setTimeout(function() {
          try { ov.remove(); } catch (_) { ov.style.display = 'none'; }
        }, 250);
      }
    };
    setTimeout(function() {
      if (typeof window._dismissLoadingOverlay === 'function') {
        window._dismissLoadingOverlay();
      }
    }, 4000);
  </script>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

  <!-- Fullscreen Project Loading Overlay (Dismissed immediately after composition loads) -->
  <div id="editor-loading-overlay" class="editor-loading-overlay" aria-label="Loading Project" role="status">
    <div class="editor-loading-content">
      <img src="assets/icon.svg" alt="OpenFishTools" class="editor-loading-logo" width="52" height="52">
      <div class="editor-loading-spinner" aria-hidden="true"></div>
      <div class="editor-loading-title" id="editor-loading-title">Loading Project...</div>
      <div class="editor-loading-sub">Preparing composition & assets</div>
    </div>
  </div>

  <div class="editor-viewport desktop-viewport">
    
    <!-- 1. Top Header Bar -->
    <!-- 1. Top Header Bar (Desktop Workstation Menu / Topbar) -->
    <header class="editor-header desktop-header" id="editor-header">
      <!-- Default Navigation (Project Mode) -->
      <div class="editor-header-nav" id="header-nav-project">
        <div class="editor-header-left">
          <!-- Back button leading to project hub -->
          <a href="index.html" class="editor-back-btn" id="editor-project-back-btn" title="Back to Projects" aria-label="Back to Projects">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
          </a>
          <!-- Inline Editable Project Title Input -->
          <input type="text" class="editor-title-input" id="editor-project-name" value="" placeholder="Project Name..." autocomplete="off" spellcheck="false" aria-label="Project Name">

          <!-- Precompose Breadcrumb Elements (Shown when inside precomp) -->
          <div class="editor-precomp-breadcrumb" id="editor-precomp-breadcrumb" style="display: none;">
            <button type="button" class="editor-breadcrumb-btn" id="btn-precomp-exit" title="Exit to Main Composition" aria-label="Exit to Main Composition">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
              </svg>
              <span id="breadcrumb-project-name" class="breadcrumb-text">Project</span>
            </button>
            <span class="editor-breadcrumb-sep" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
              </svg>
            </span>
            <input type="text" class="editor-title-input editor-precomp-name-input" id="editor-precomp-name" value="Pre-comp 1" placeholder="Precompose Name..." autocomplete="off" spellcheck="false" aria-label="Precompose Name">
          </div>
        </div>

        <!-- Right Header Actions (Settings & Export) -->
        <div class="editor-header-right-actions">
          <button type="button" class="editor-precomp-collapse-btn" id="btn-precomp-collapse" title="For Comp layer: Collapse Transformations; For vector layer: Continuously Rasterize" aria-label="Collapse Transformations" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
              <line x1="12" y1="2.5" x2="12" y2="5.5"/>
              <line x1="12" y1="18.5" x2="12" y2="21.5"/>
              <line x1="2.5" y1="12" x2="5.5" y2="12"/>
              <line x1="18.5" y1="12" x2="21.5" y2="12"/>
              <line x1="5.28" y1="5.28" x2="7.4" y2="7.4"/>
              <line x1="16.6" y1="16.6" x2="18.72" y2="18.72"/>
              <line x1="5.28" y1="18.72" x2="7.4" y2="16.6"/>
              <line x1="16.6" y1="7.4" x2="18.72" y2="5.28"/>
            </svg>
          </button>
          <button type="button" class="editor-settings-btn" id="btn-desktop-mobile-view" title="Switch to Mobile View" aria-label="Switch to Mobile View" onclick="proceedToMobileView()">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
            </svg>
          </button>
          <button type="button" class="editor-settings-btn" id="btn-editor-template" title="Template Editor" aria-label="Template Editor" onclick="if(window.FishTemplateEditor) window.FishTemplateEditor.open()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
          </button>


          <button type="button" class="editor-settings-btn" id="btn-editor-settings" title="Composition Settings" aria-label="Composition Settings" onclick="openProjectSettingsModal()">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.
